name: Build C++ IDE FAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential cmake python3 python3-pip
        pip3 install protobuf==3.20.0

    - name: Install ARM Embedded Toolchain
      run: |
        cd /tmp
        wget https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        tar xf arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        echo "/tmp/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH

    - name: Clone Flipper Firmware (SDK only)
      run: |
        cd /tmp
        git clone --depth 1 https://github.com/flipperdevices/flipperzero-firmware.git fw_sdk

    - name: Build cpp_ide as External FAP
      run: |
        export FLIPPER_FW_PATH=/tmp/fw_sdk
        cd $GITHUB_WORKSPACE
        /tmp/fw_sdk/fbt -C . fap
        mkdir -p /tmp/output
        find build -name "cpp_ide.fap" -type f -exec cp {} /tmp/output/ \;
        if [ ! -f /tmp/output/cpp_ide.fap ]; then
          echo "ERROR: cpp_ide.fap not found"
          echo "Build directory contents:"
          find build -type f -name "*.fap" | head -10 || echo "No FAP files found"
          exit 1
        fi
        ls -lh /tmp/output/cpp_ide.fap

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cpp_ide.fap
        path: /tmp/output/cpp_ide.fap
        if-no-files-found: error
