name: Build C++ IDE FAP

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq git build-essential cmake python3 python3-pip
        pip3 install -q protobuf==3.20.0

        cd /tmp
        wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        tar xf arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        echo "/tmp/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH

    - name: Build
      run: |
        cd /tmp
        git clone --recursive -q https://github.com/flipperdevices/flipperzero-firmware.git
        cd flipperzero-firmware

        echo "Step 1: Create app directory"
        mkdir -p applications/examples/cpp_ide

        echo "Step 2: Copy source files - MINIMAL APP ONLY for diagnostic"
        cp $GITHUB_WORKSPACE/application.fam applications/examples/cpp_ide/
        # Diagnostic: use ONLY minimal app with no dependencies
        cp $GITHUB_WORKSPACE/application_minimal.c applications/examples/cpp_ide/application.c
        # Don't copy editor/interpreter for minimal test - if minimal builds, infrastructure works

        echo "Step 3: Verify files copied"
        ls -la applications/examples/cpp_ide/

        echo "Step 4: Show application.fam"
        cat applications/examples/cpp_ide/application.fam

        echo "Step 5: Run fbt faps with full output"
        ./fbt faps 2>&1 | tee /tmp/fbt_build.log

        echo ""
        echo "Step 5b: Save full log for debugging"
        cp /tmp/fbt_build.log /tmp/cpp_ide_fbt.log

        echo "Step 6: Check for cpp_ide.fap"
        if [ -f "build/f7-firmware-D/.extapps/cpp_ide.fap" ]; then
          echo "SUCCESS!"
          cp build/f7-firmware-D/.extapps/cpp_ide.fap /tmp/cpp_ide.fap
        else
          echo "FAILED - cpp_ide.fap not found"
          find build -name "*.fap" 2>/dev/null | head -10
          exit 1
        fi

    - name: Upload FAP artifact
      uses: actions/upload-artifact@v4
      with:
        name: cpp_ide.fap
        path: /tmp/cpp_ide.fap
        if-no-files-found: warn

    - name: Upload build log for debugging
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fbt_build_log
        path: /tmp/cpp_ide_fbt.log
        if-no-files-found: warn
