name: Build C++ IDE FAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential cmake python3 python3-pip
        pip3 install protobuf==3.20.0

    - name: Install ARM Embedded Toolchain
      run: |
        cd /tmp
        wget https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        tar xf arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        echo "/tmp/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH

    - name: Clone Flipper Firmware and Setup
      run: |
        cd /tmp
        git clone --recursive https://github.com/flipperdevices/flipperzero-firmware.git
        cd flipperzero-firmware
        cp -r $GITHUB_WORKSPACE applications/examples/cpp_ide
        echo "cpp_ide copied successfully"

    - name: Build FAP
      run: |
        cd /tmp/flipperzero-firmware
        ./fbt faps 2>&1 | tee /tmp/build.log
        find build/f7-firmware-D/.extapps -name "*.fap" -type f | sort

    - name: Verify cpp_ide.fap
      run: |
        FAP_FILE="build/f7-firmware-D/.extapps/cpp_ide.fap"
        if [ ! -f "/tmp/flipperzero-firmware/$FAP_FILE" ]; then
          echo "ERROR: cpp_ide.fap not found"
          tail -100 /tmp/build.log
          exit 1
        fi
        echo "SUCCESS: cpp_ide.fap built!"
        ls -lh /tmp/flipperzero-firmware/$FAP_FILE
        cp /tmp/flipperzero-firmware/$FAP_FILE /tmp/cpp_ide.fap

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cpp_ide.fap
        path: /tmp/cpp_ide.fap
        if-no-files-found: error
