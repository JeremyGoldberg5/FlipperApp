name: Build C++ IDE FAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential cmake python3 python3-pip
        pip3 install protobuf==3.20.0

    - name: Install ARM Embedded Toolchain
      run: |
        cd /tmp
        wget https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        tar xf arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        echo "/tmp/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH

    - name: Clone Flipper Firmware
      run: |
        cd /tmp
        git clone --recursive https://github.com/flipperdevices/flipperzero-firmware.git
        cd flipperzero-firmware

        # Create external apps directory
        mkdir -p applications/external

        # Copy app files directly to applications/external (not in a subdirectory)
        cp $GITHUB_WORKSPACE/application.fam applications/external/
        cp $GITHUB_WORKSPACE/application.c applications/external/
        cp $GITHUB_WORKSPACE/application.h applications/external/
        cp $GITHUB_WORKSPACE/CMakeLists.txt applications/external/
        cp -r $GITHUB_WORKSPACE/editor applications/external/
        cp -r $GITHUB_WORKSPACE/interpreter applications/external/

        # Add external apps directory to main CMakeLists if not already present
        CMAKE_FILE="CMakeLists.txt"
        if [ -f "$CMAKE_FILE" ]; then
          if ! grep -q "add_subdirectory(applications/external)" "$CMAKE_FILE"; then
            sed -i '/add_subdirectory(applications\/main)/a add_subdirectory(applications/external)' "$CMAKE_FILE"
            echo "Added applications/external to CMakeLists.txt"
          else
            echo "applications/external already in CMakeLists.txt"
          fi
        fi

        echo "=== applications/external structure ==="
        ls -la applications/external/
        echo ""
        echo "=== Content of applications/external/application.fam ==="
        cat applications/external/application.fam

    - name: Build FAP
      run: |
        cd /tmp/flipperzero-firmware
        ./fbt faps 2>&1 | tee build.log

        # List all built FAPs to verify what was created
        echo ""
        echo "=== All built FAP files ==="
        find build/f7-firmware-D/.extapps -name "*.fap" -type f | sort

        # Verify cpp_ide.fap exists - FAIL if missing
        echo ""
        echo "=== Checking for cpp_ide.fap ==="
        FAP_FILE="build/f7-firmware-D/.extapps/cpp_ide.fap"
        if [ ! -f "$FAP_FILE" ]; then
          echo "FATAL: cpp_ide.fap not found at $FAP_FILE"
          echo "Build FAILED - external app was not compiled"
          exit 1
        fi
        echo "SUCCESS: Found $FAP_FILE"
        ls -lh "$FAP_FILE"

    - name: Upload FAP artifact
      uses: actions/upload-artifact@v4
      with:
        name: cpp_ide.fap
        path: /tmp/flipperzero-firmware/build/f7-firmware-D/.extapps/cpp_ide.fap
        if-no-files-found: error

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: /tmp/flipperzero-firmware/build/f7_build/fap_cpp_ide.fap
