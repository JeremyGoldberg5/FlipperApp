name: Build C++ IDE FAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential cmake python3 python3-pip
        sudo apt-get install -y arm-none-eabi-gcc arm-none-eabi-newlib
        pip3 install protobuf==3.20.0

    - name: Clone Flipper Firmware
      run: |
        cd /tmp
        git clone --recursive https://github.com/flipperdevices/flipperzero-firmware.git
        cd flipperzero-firmware
        mkdir -p applications/external/cpp_ide
        cp -r $GITHUB_WORKSPACE/* applications/external/cpp_ide/

    - name: Build FAP
      run: |
        cd /tmp/flipperzero-firmware
        ./fbt fap_cpp_ide

    - name: Upload FAP artifact
      uses: actions/upload-artifact@v4
      with:
        name: cpp_ide.fap
        path: /tmp/flipperzero-firmware/build/f7_build/fap_cpp_ide.fap

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: /tmp/flipperzero-firmware/build/f7_build/fap_cpp_ide.fap
