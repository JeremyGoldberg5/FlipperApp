name: Build C++ IDE FAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential cmake python3 python3-pip
        pip3 install protobuf==3.20.0

    - name: Install ARM Embedded Toolchain
      run: |
        cd /tmp
        wget https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        tar xf arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        echo "/tmp/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH

    - name: Clone Flipper Firmware
      run: |
        cd /tmp
        git clone --recursive https://github.com/flipperdevices/flipperzero-firmware.git

    - name: Build cpp_ide FAP as external application
      run: |
        # Copy app source to home directory (where external FAPs are built from)
        mkdir -p /tmp/cpp_ide_build
        cd /tmp/cpp_ide_build

        # Copy source files
        cp -r $GITHUB_WORKSPACE/* .

        # Remove workflow files and git artifacts
        rm -rf .github .git

        # Verify application.fam exists
        if [ ! -f "application.fam" ]; then
          echo "FATAL: application.fam not found in source"
          exit 1
        fi

        # Use fbt from the cloned firmware to build this FAP
        # fbt can build a FAP from any directory if it has application.fam
        /tmp/flipperzero-firmware/fbt -C . fap 2>&1 | tee build.log

        # The FAP file should be generated at build/<target>/.extapps/<appid>.fap
        echo ""
        echo "=== Checking for cpp_ide.fap after build ==="

        # Find the generated FAP file
        FAP_FILE=$(find . -name "cpp_ide.fap" -type f 2>/dev/null | head -1)

        if [ -z "$FAP_FILE" ]; then
          echo "FATAL: cpp_ide.fap not found after build"
          echo ""
          echo "=== Checking directory structure ==="
          find . -type d -name ".extapps" 2>/dev/null
          find . -type f -name "*.fap" 2>/dev/null | head -20
          exit 1
        fi

        echo "SUCCESS: Found cpp_ide.fap at $FAP_FILE"
        ls -lh "$FAP_FILE"

        # Copy to standard location for upload
        mkdir -p /tmp/cpp_ide_fap
        cp "$FAP_FILE" /tmp/cpp_ide_fap/cpp_ide.fap
        ls -lh /tmp/cpp_ide_fap/cpp_ide.fap

    - name: Upload FAP artifact
      uses: actions/upload-artifact@v4
      with:
        name: cpp_ide.fap
        path: /tmp/cpp_ide_fap/cpp_ide.fap
        if-no-files-found: error

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: /tmp/cpp_ide_fap/cpp_ide.fap
