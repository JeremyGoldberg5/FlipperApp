name: Build C++ IDE FAP

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq git build-essential cmake python3 python3-pip
        pip3 install -q protobuf==3.20.0

        cd /tmp
        wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        tar xf arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        echo "/tmp/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH

    - name: Build
      run: |
        cd /tmp
        git clone --recursive -q https://github.com/flipperdevices/flipperzero-firmware.git
        cd flipperzero-firmware

        echo "Step 1: Create app directory"
        mkdir -p applications/examples/cpp_ide

        echo "Step 2: Copy source files (apps MUST have application.fam, not appid.fam)"
        mkdir -p applications/examples/test_app
        cp $GITHUB_WORKSPACE/test_app.fam applications/examples/test_app/application.fam
        cp $GITHUB_WORKSPACE/test_app.c applications/examples/test_app/

        cp $GITHUB_WORKSPACE/application.fam applications/examples/cpp_ide/application.fam
        cp $GITHUB_WORKSPACE/application.c applications/examples/cpp_ide/
        cp $GITHUB_WORKSPACE/application.h applications/examples/cpp_ide/
        cp -r $GITHUB_WORKSPACE/editor applications/examples/cpp_ide/ || true
        cp -r $GITHUB_WORKSPACE/interpreter applications/examples/cpp_ide/ || true

        echo "Step 3: Verify files copied"
        ls -la applications/examples/cpp_ide/
        ls -la applications/examples/cpp_ide/editor/ || echo "editor/ not found"
        ls -la applications/examples/cpp_ide/interpreter/ || echo "interpreter/ not found"

        echo "Step 4: Show application.fam"
        cat applications/examples/cpp_ide/application.fam

        echo "Step 4b: Check file sizes"
        wc -l applications/examples/cpp_ide/*.c applications/examples/cpp_ide/*.h 2>&1 | tail -15

        echo "Step 4c: Count all application.fam files in examples/"
        find applications/examples -name "application.fam" -exec echo {} \;

        echo "Step 4d-debug: Check if applications/examples has a CMakeLists.txt"
        if [ -f "applications/examples/CMakeLists.txt" ]; then
          echo "Found applications/examples/CMakeLists.txt"
          grep -i "add_subdirectory\|cpp_ide\|test_app" applications/examples/CMakeLists.txt || echo "No cpp_ide or test_app references found"
        else
          echo "No CMakeLists.txt in applications/examples/"
        fi
        ls -la applications/examples/ | grep -E "CMakeLists|cpp_ide|test_app"

        echo "Step 5: Build test_app FAP with correct command: fbt fap_test_app"
        echo "(cpp_ide has compilation errors - fixing separately)"
        ./fbt fap_test_app 2>&1 | tee /tmp/fbt_build.log

        echo "Step 5b: Save full log for debugging"
        cp /tmp/fbt_build.log /tmp/cpp_ide_fbt.log

        echo "Step 6: Find and copy the generated test_app.fap"
        FAP_FILE=$(find build -name "test_app.fap" -type f 2>/dev/null | head -1)
        if [ -n "$FAP_FILE" ]; then
          echo "SUCCESS - Found test_app.fap at: $FAP_FILE"
          cp "$FAP_FILE" /tmp/cpp_ide.fap
          echo "FAP file size:"
          ls -lh /tmp/cpp_ide.fap
        else
          echo "FAILED - test_app.fap not found. Looking for any FAP files:"
          find build -name "*.fap" -type f 2>/dev/null | head -5 || echo "No FAP files found in build directory"
          exit 1
        fi

    - name: Upload FAP artifact
      uses: actions/upload-artifact@v4
      with:
        name: cpp_ide.fap
        path: /tmp/cpp_ide.fap
        if-no-files-found: warn

    - name: Upload build log for debugging
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fbt_build_log
        path: /tmp/cpp_ide_fbt.log
        if-no-files-found: warn
