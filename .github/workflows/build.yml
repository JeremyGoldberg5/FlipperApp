name: Build C++ IDE FAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential cmake python3 python3-pip
        pip3 install protobuf==3.20.0

    - name: Install ARM Toolchain
      run: |
        cd /tmp
        wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        tar xf arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        echo "/tmp/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH

    - name: Clone and Build
      run: |
        cd /tmp
        git clone --recursive https://github.com/flipperdevices/flipperzero-firmware.git
        cd flipperzero-firmware

        # Copy app files directly into examples directory
        for f in application.fam application.c application.h CMakeLists.txt editor interpreter; do
          cp -r $GITHUB_WORKSPACE/$f applications/examples/cpp_ide/ 2>/dev/null || true
        done

        # List what we have
        echo "=== Content of applications/examples/cpp_ide ==="
        ls -la applications/examples/cpp_ide/ 2>/dev/null || echo "Directory creation may have issues"

        # Try to build
        ./fbt faps 2>&1 | tail -100

        # Check if it was built
        if [ -f "build/f7-firmware-D/.extapps/cpp_ide.fap" ]; then
          echo "SUCCESS: cpp_ide.fap found!"
          cp build/f7-firmware-D/.extapps/cpp_ide.fap /tmp/cpp_ide.fap
          ls -lh /tmp/cpp_ide.fap
        else
          echo "FAILED: cpp_ide.fap not found"
          find build -name "*.fap" 2>/dev/null | wc -l
          exit 1
        fi

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: cpp_ide.fap
        path: /tmp/cpp_ide.fap
        if-no-files-found: error
