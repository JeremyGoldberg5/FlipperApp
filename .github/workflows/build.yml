name: Build C++ IDE FAP

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq git build-essential cmake python3 python3-pip
        pip3 install -q protobuf==3.20.0

        cd /tmp
        wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        tar xf arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        echo "/tmp/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH

    - name: Build
      run: |
        cd /tmp
        git clone --recursive -q https://github.com/flipperdevices/flipperzero-firmware.git
        cd flipperzero-firmware

        echo "Step 1: Create test app directory (trying different appid)"
        mkdir -p applications/examples/test_app

        echo "Step 2: Copy test app files"
        cp $GITHUB_WORKSPACE/test_app.fam applications/examples/test_app/application.fam
        cp $GITHUB_WORKSPACE/test_app.c applications/examples/test_app/test_app.c
        cp $GITHUB_WORKSPACE/test_app_cmake.txt applications/examples/test_app/CMakeLists.txt

        echo "Step 3: Verify files copied"
        ls -la applications/examples/test_app/

        echo "Step 4: Show test_app application.fam"
        cat applications/examples/test_app/application.fam

        echo "Step 5: Run fbt with full output (not fbt faps - examples apps are built with main firmware)"
        ./fbt 2>&1 | tee /tmp/fbt_build.log

        echo ""
        echo "Step 5b: Save full log for debugging"
        cp /tmp/fbt_build.log /tmp/cpp_ide_fbt.log

        echo "Step 6: Check for test_app.fap"
        if [ -f "build/f7-firmware-D/.extapps/test_app.fap" ]; then
          echo "SUCCESS - test_app.fap built!"
          cp build/f7-firmware-D/.extapps/test_app.fap /tmp/test_app.fap
        else
          echo "FAILED - test_app.fap not found. Listing all FAP files:"
          find build -name "*.fap" 2>/dev/null | head -10
          exit 1
        fi

    - name: Upload FAP artifact
      uses: actions/upload-artifact@v4
      with:
        name: test_app.fap
        path: /tmp/test_app.fap
        if-no-files-found: warn

    - name: Upload build log for debugging
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fbt_build_log
        path: /tmp/cpp_ide_fbt.log
        if-no-files-found: warn
