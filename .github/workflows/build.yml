name: Build C++ IDE FAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential cmake python3 python3-pip
        pip3 install protobuf==3.20.0

    - name: Install ARM Embedded Toolchain
      run: |
        cd /tmp
        wget https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        tar xf arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        echo "/tmp/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH

    - name: Clone Flipper Firmware
      run: |
        cd /tmp
        git clone --recursive https://github.com/flipperdevices/flipperzero-firmware.git
        cd flipperzero-firmware

        # Copy cpp_ide app into applications/examples/ (not external/)
        # This is the ONLY directory guaranteed to be scanned by fbt's app discovery
        echo "Copying cpp_ide to applications/examples/"
        cp -r $GITHUB_WORKSPACE applications/examples/cpp_ide

        # Verify all required files are present
        echo ""
        echo "=== cpp_ide contents in applications/examples/ ==="
        ls -la applications/examples/cpp_ide/
        echo ""

        # Show the application.fam that will be discovered
        echo "=== application.fam content ==="
        cat applications/examples/cpp_ide/application.fam

    - name: Build FAP from firmware
      run: |
        cd /tmp/flipperzero-firmware

        # DIAGNOSTIC: Verify cpp_ide was actually copied
        echo "=== DIAGNOSTIC: Check if cpp_ide exists ==="
        if [ -d "applications/examples/cpp_ide" ]; then
          echo "✓ cpp_ide directory exists"
          ls -la applications/examples/cpp_ide/ | head -20
        else
          echo "✗ FATAL: cpp_ide directory does NOT exist"
          echo "Available examples:"
          ls -d applications/examples/*/ | head -20
          exit 1
        fi

        if [ -f "applications/examples/cpp_ide/application.fam" ]; then
          echo "✓ application.fam exists"
          echo "Content:"
          cat applications/examples/cpp_ide/application.fam
        else
          echo "✗ FATAL: application.fam NOT found"
          exit 1
        fi

        echo ""
        echo "=== Running fbt faps ==="
        # Run fbt faps to build all FAPs, including cpp_ide
        # fbt will automatically discover cpp_ide in applications/examples/
        ./fbt faps 2>&1 | tee build.log

        echo ""
        echo "=== All FAP files generated ==="
        find build/f7-firmware-D/.extapps -name "*.fap" -type f | sort

        echo ""
        echo "=== Looking for cpp_ide.fap ==="
        FAP_PATH="build/f7-firmware-D/.extapps/cpp_ide.fap"

        if [ ! -f "$FAP_PATH" ]; then
          echo "FATAL: cpp_ide.fap was not built"
          echo "Expected location: $FAP_PATH"
          echo ""
          echo "=== Last 50 lines of build log ==="
          tail -50 build.log
          exit 1
        fi

        echo "SUCCESS: cpp_ide.fap found!"
        ls -lh "$FAP_PATH"

        # Copy to output directory for upload
        mkdir -p /tmp/fap_output
        cp "$FAP_PATH" /tmp/fap_output/cpp_ide.fap
        ls -lh /tmp/fap_output/cpp_ide.fap

    - name: Upload FAP artifact
      uses: actions/upload-artifact@v4
      with:
        name: cpp_ide.fap
        path: /tmp/fap_output/cpp_ide.fap
        if-no-files-found: error

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: /tmp/fap_output/cpp_ide.fap
