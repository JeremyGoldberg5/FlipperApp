name: Build C++ IDE FAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential cmake python3 python3-pip
        pip3 install protobuf==3.20.0

    - name: Install ARM Embedded Toolchain
      run: |
        cd /tmp
        wget https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        tar xf arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        echo "/tmp/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH

    - name: Clone Flipper Firmware
      run: |
        cd /tmp
        git clone --recursive https://github.com/flipperdevices/flipperzero-firmware.git
        cd flipperzero-firmware
        # Create app directory matching the appid
        mkdir -p applications/external/cpp_ide
        # Copy app files to subdirectory (exclude manifest.c which is for internal apps)
        cp $GITHUB_WORKSPACE/application.fam applications/external/cpp_ide/
        cp $GITHUB_WORKSPACE/application.c applications/external/cpp_ide/
        cp $GITHUB_WORKSPACE/application.h applications/external/cpp_ide/
        cp $GITHUB_WORKSPACE/CMakeLists.txt applications/external/cpp_ide/
        cp -r $GITHUB_WORKSPACE/editor applications/external/cpp_ide/
        cp -r $GITHUB_WORKSPACE/interpreter applications/external/cpp_ide/

        # Create CMakeLists.txt for external apps directory to enable app discovery
        printf 'cmake_minimum_required(VERSION 3.22)\nproject(flipper_external_apps)\nfile(GLOB app_dirs "${CMAKE_CURRENT_SOURCE_DIR}/*")\nforeach(app_dir ${app_dirs})\n  if(EXISTS "${app_dir}/application.fam" AND IS_DIRECTORY "${app_dir}")\n    get_filename_component(app_name ${app_dir} NAME)\n    add_subdirectory(${app_name})\n  endif()\nendforeach()\n' > applications/external/CMakeLists.txt

        ls -la applications/external/cpp_ide/
        echo ""
        echo "=== Content of application.fam ==="
        cat applications/external/cpp_ide/application.fam
        echo ""
        echo "=== CMakeLists.txt in applications/external ==="
        cat applications/external/CMakeLists.txt

    - name: Build FAP
      run: |
        cd /tmp/flipperzero-firmware
        echo "=== Checking applications/external structure ==="
        ls -la applications/external/
        echo ""
        echo "=== Checking if CMakeLists.txt exists ==="
        [ -f applications/external/CMakeLists.txt ] && echo "EXISTS" || echo "MISSING"
        cat applications/external/CMakeLists.txt
        echo ""
        echo "=== Checking cpp_ide files ==="
        ls -la applications/external/cpp_ide/
        echo ""
        echo "=== Starting fbt build ==="
        ./fbt faps 2>&1 | tee build.log
        echo ""
        echo "=== Build completed. Checking for FAP file ==="
        echo "=== Looking in build/f7-firmware-D/.extapps/ ==="
        ls -la build/f7-firmware-D/.extapps/*.fap 2>/dev/null | grep cpp_ide || echo "cpp_ide.fap not found in extapps"
        echo ""
        echo "=== All FAP files in build directory ==="
        find build -name "*.fap" -o -name "*cpp_ide*" | head -20
        echo ""
        echo "=== Search fbt output for app loading ==="
        grep -i "loading\|discovering\|cpp_ide" build.log | head -30

    - name: Upload FAP artifact
      uses: actions/upload-artifact@v4
      with:
        name: cpp_ide.fap
        path: /tmp/flipperzero-firmware/build/f7-firmware-D/.extapps/cpp_ide.fap
        if-no-files-found: warn

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: /tmp/flipperzero-firmware/build/f7_build/fap_cpp_ide.fap
